<header class="site-header">
  <div class="container header-inner">
    <div class="brand-group">
      <a class="cwi-logo" href="https://www.cwi.nl/en/" title="{{ site.course.institute }}">
        {% include cwi-logo.html %}
      </a>
      <span class="brand-divider" aria-hidden="true"></span>
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-text">{{ site.title }}</span>
      </a>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="{{ '/#overview' | relative_url }}">Overview</a>
      <a href="{{ '/#schedule' | relative_url }}">Schedule</a>
      <a href="{{ '/#practical' | relative_url }}">Practical info</a>
      <a href="{{ '/#instructors' | relative_url }}">Instructors</a>
      <a href="{{ '/resources/' | relative_url }}"{% if page.url == '/resources/' %} aria-current="page"{% endif %}>Resources</a>
      <a class="nav-cta" href="{{ '/register/' | relative_url }}">Register</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </div>
</header>
